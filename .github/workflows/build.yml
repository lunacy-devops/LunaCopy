name: Build & Release LunaCopy

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine Build Version
        shell: pwsh
        run: |
          # Tagged builds use the tag (v1.2.0 -> 1.2.0); other builds use the Version from LunaCopy.csproj
          $ver = ""
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          Write-Host "Version override: '$ver'"
          $versionArg = if ($ver) { "-p:Version=$ver" } else { "" }
          "VERSION_ARG=$versionArg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore dependencies
        run: dotnet restore LunaCopy.sln

      - name: Run Tests
        run: dotnet test LunaCopy.sln --configuration Release --verbosity normal

      - name: Publish Single-File Executable
        run: dotnet publish LunaCopy.csproj -c Release -r win-x64 ${{ env.VERSION_ARG }} -o publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaCopy-win-x64
          path: publish/LunaCopy.exe

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/LunaCopy.exe
          generate_release_notes: true
